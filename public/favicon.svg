<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(155,85%,42%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(185,85%,42%);stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="hsl(160,20%,8%)" />
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#ag-grad)" stroke-width="2" opacity="0.6"/>
  <!-- AG monogram -->
  <text x="50" y="62" 
        font-family="'Outfit', Arial, sans-serif" 
        font-weight="700" 
        font-size="36" 
        text-anchor="middle" 
        fill="url(#ag-grad)"
        filter="url(#glow)">AG</text>
  <!-- Small sigma symbol -->
  <text x="50" y="78"
        font-family="Arial, sans-serif"
        font-size="11"
        text-anchor="middle"
        fill="hsl(45,90%,52%)"
        opacity="0.9">∑ σ μ</text>
</svg>